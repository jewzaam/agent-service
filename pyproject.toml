# Generated By: Claude Code (Claude Opus 4.6)

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-service"
version = "0.1.0"
description = "Standalone FastAPI service hosting a Claude SDK agent."
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
authors = [
    {name = "Naveen Malik"}
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "prometheus-client>=0.21",
    "PyJWT[crypto]>=2.9",
    "httpx>=0.28",
    "claude-agent-sdk>=0.1.50",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.0",
    "pytest-asyncio>=0.24",
    "black>=23.0",
    "flake8>=6.0",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
    "mutmut>=2.0,<3.0",
    "radon>=6.0",
    "xenon>=0.9",
    "httpx>=0.28",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_service*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.mutmut]
paths_to_mutate = ["agent_service/"]
also_copy = ["conftest.py"]
pytest_add_cli_args = ["-p", "no:asyncio", "-p", "no:anyio"]
